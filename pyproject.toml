[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "klib-forge"
version = "1.0.0"
description = "Local-first build system for portable AI knowledge libraries."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "K-LIB Forge Contributors" }]
maintainers = [{ name = "K-LIB Forge Maintainers" }]
keywords = ["rag", "knowledge-base", "local-first", "tauri", "llm", "mcp"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.20,<1",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pyinstaller>=6.16,<7",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "twine>=6,<7",
  "pip-audit>=2.10,<3",
  "pip-tools>=7.5,<8",
]
chroma = ["chromadb>=1,<2"]

[project.scripts]
klib = "klib_cli.main:app"
klib-api = "klib_api.main:run"
klib-mcp = "klib_core.mcp_server:run"

[tool.setuptools.packages.find]
where = [
  "packages/klib-core/src",
  "packages/klib-cli/src",
  "services/api/src",
]

[tool.setuptools.package-data]
klib_core = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
