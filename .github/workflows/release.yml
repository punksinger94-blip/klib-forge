name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-2025-vs2026
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@1.91.1
      - run: python -m pip install -r requirements/dev-lock.txt
      - run: python -m pip install --no-deps -e .
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (python -c "from klib_core import __version__; print(__version__)").Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }
      - run: npm ci
        working-directory: apps/desktop
      - run: .\scripts\build.ps1
      - name: Decode signing certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if (-not $env:CERTIFICATE_BASE64) { throw "WINDOWS_CERTIFICATE_BASE64 is required" }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
      - name: Sign installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PATH: ${{ runner.temp }}\codesign.pfx
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $installer = (Get-ChildItem "apps\desktop\src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1).FullName
          .\scripts\sign-windows.ps1 -Path $installer
      - name: Generate checksums and SBOMs
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "apps\desktop\src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1).FullName
          .\scripts\generate-release-metadata.ps1 -Installer $installer
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: dist/release/*

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/klib-forge
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/klib-forge
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: dist/release
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/release-notes-1.0.0.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/release/*
