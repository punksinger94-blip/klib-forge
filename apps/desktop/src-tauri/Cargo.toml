[package]
name = "klib-forge-desktop"
version = "1.0.0"
description = "Desktop IDE for portable K-LIB knowledge packages."
authors = ["K-LIB Forge Contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.91.1"

[lib]
name = "klib_forge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
